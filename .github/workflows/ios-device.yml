name: iOS Direct Device Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
  IOS_PROFILE_NAME: ${{ secrets.IOS_ADHOC_PROFILE_NAME }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Import canonical distribution identity
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/bingo.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf %s "$DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -A -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN"

      - name: Build iPad-installable IPA
        env:
          ASC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          IOS_EXPORT_METHOD: ad-hoc
        run: tools/build-ios-appstore.sh

      - name: Verify ad-hoc device profile
        run: |
          set -euo pipefail
          IPA="$(find src-tauri/gen/apple/build/export -name '*.ipa' | head -1)"
          test -f "$IPA"
          PROFILE_PATH="$(unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/embedded\.mobileprovision$' | head -1)"
          unzip -p "$IPA" "$PROFILE_PATH" > "$RUNNER_TEMP/embedded.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          plutil -extract ProvisionedDevices xml1 -o - "$RUNNER_TEMP/profile.plist" | grep -q '<string>'
          test "$(plutil -extract Entitlements.get-task-allow raw -o - "$RUNNER_TEMP/profile.plist")" = "false"

      - uses: actions/upload-artifact@v7
        with:
          name: crispbingo-ipad-direct
          path: src-tauri/gen/apple/build/export/*.ipa
          if-no-files-found: error
          retention-days: 3
