[package]
name = "bingo-party"
version = "1.0.0"
description = "75-ball bingo for three players on one screen"
authors = ["Christian Strobele"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

# iOS never links a Rust binary: cargo emits libapp.a and Xcode does the final
# link, so the crate MUST expose a library target — and it must be called `app`,
# because the generated project.yml links `libapp.a` by that literal name.
[lib]
name = "app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# LAN play: the native app hosts the game for every other device in the WLAN
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
futures-util = "0.3"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
